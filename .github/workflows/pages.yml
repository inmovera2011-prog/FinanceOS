name: Deploy FinanceOS a GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:   # permite ejecutar manualmente desde la UI

# Permisos necesarios para GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Solo un deploy a la vez
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      # Configurar GitHub Pages
      - name: Configurar Pages
        uses: actions/configure-pages@v4

      # Subir todo el repo como artefacto (excepto .git y node_modules)
      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # Deploy a GitHub Pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
