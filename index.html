<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f172a">
<title>FinanceOS</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/favicon.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/core@2.1.1/css/phosphor-icons.min.css">
</head>
<body>

<!-- ═══ LOADING ═══ -->
<div id="loading-screen">
  <div class="loading-logo">Finance<span>OS</span></div>
  <div class="loading-bar"><div class="loading-bar-fill"></div></div>
  <div class="fs-xs text-3" id="loading-msg">Verificando sesión...</div>
</div>

<!-- ═══ AUTH ═══ -->
<div id="auth-wrap">
  <div class="auth-wrap">
    <div class="logo">
      <div class="logo-text">Finance<span>OS</span></div>
      <div class="logo-sub">Gesti&oacute;n financiera personal</div>
    </div>
    <div class="card">
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-in"  onclick="switchTab('in')">Ingresar</button>
        <button class="auth-tab"        id="tab-reg" onclick="switchTab('reg')">Registrarse</button>
      </div>
      <div id="auth-alert" class="hidden"></div>
      <form id="form-in" onsubmit="doLogin(event)">
        <div class="form-group">
          <label>Correo electr&oacute;nico</label>
          <div class="inp-wrap">
            <span class="inp-icon"><i class="ph ph-envelope"></i></span>
            <input id="in-email" type="email" placeholder="tu@email.com" autocomplete="email" required>
          </div>
        </div>
        <div class="form-group">
          <label>Contrase&ntilde;a</label>
          <div class="inp-wrap">
            <span class="inp-icon"><i class="ph ph-lock"></i></span>
            <input id="in-pass" type="password" placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" class="inp-eye" onclick="toggleEye('in-pass',this)"><i class="ph ph-eye"></i></button>
          </div>
          <button type="button" class="forgot" onclick="doForgot()">¿Olvidaste tu contrase&ntilde;a?</button>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btn-in">Ingresar</button>
        <div class="divider">o</div>
        <button type="button" class="btn-google" onclick="doGoogle()">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18" alt="">
          Continuar con Google
        </button>
      </form>
      <form id="form-reg" class="hidden" onsubmit="doRegister(event)">
        <div class="form-group">
          <label>Nombre completo</label>
          <input id="reg-name" type="text" placeholder="Tu nombre" autocomplete="name" required>
        </div>
        <div class="form-group">
          <label>Correo electr&oacute;nico</label>
          <div class="inp-wrap">
            <span class="inp-icon"><i class="ph ph-envelope"></i></span>
            <input id="reg-email" type="email" placeholder="tu@email.com" autocomplete="email" required>
          </div>
        </div>
        <div class="form-group">
          <label>Contrase&ntilde;a</label>
          <div class="inp-wrap">
            <span class="inp-icon"><i class="ph ph-lock"></i></span>
            <input id="reg-pass" type="password" placeholder="M&iacute;nimo 8 caracteres" autocomplete="new-password" minlength="8" oninput="checkPw(this)" required>
            <button type="button" class="inp-eye" onclick="toggleEye('reg-pass',this)"><i class="ph ph-eye"></i></button>
          </div>
          <div class="pw-bar" id="pw-bar"></div>
        </div>
        <div class="form-group">
          <label>Confirmar contrase&ntilde;a</label>
          <div class="inp-wrap">
            <span class="inp-icon"><i class="ph ph-lock"></i></span>
            <input id="reg-pass2" type="password" placeholder="Repet&iacute; tu contrase&ntilde;a" autocomplete="new-password" required>
            <button type="button" class="inp-eye" onclick="toggleEye('reg-pass2',this)"><i class="ph ph-eye"></i></button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btn-reg">Crear cuenta</button>
        <div class="divider">o</div>
        <button type="button" class="btn-google" onclick="doGoogle()">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18" alt="">
          Continuar con Google
        </button>
      </form>
    </div>
    <div class="footer-note">Al continuar acept&aacute;s los t&eacute;rminos de uso.<br>FinanceOS &middot; 2026</div>
  </div>
</div>

<script type="module">
import { routeByRole, loginWithEmail, loginWithGoogle,
         registerUser, resetPassword, checkAuthAndRoute } from './js/auth.js';

// ── Verificar si ya hay sesi&oacute;n activa ──
const profile = await checkAuthAndRoute();
if (profile) {
  routeByRole(profile);
} else {
  document.getElementById('loading-screen').classList.add('hidden');
  document.getElementById('auth-wrap').classList.remove('hidden');
}

// ── Handlers ──
window.switchTab = (tab) => {
  const isIn = tab === 'in';
  document.getElementById('form-in').classList.toggle('hidden', !isIn);
  document.getElementById('form-reg').classList.toggle('hidden', isIn);
  document.getElementById('tab-in').classList.toggle('active', isIn);
  document.getElementById('tab-reg').classList.toggle('active', !isIn);
  clearAlertAuth();
};

window.doLogin = async (e) => {
  e.preventDefault();
  setBusyAuth('btn-in', true);
  try {
    const p = await loginWithEmail(
      document.getElementById('in-email').value.trim(),
      document.getElementById('in-pass').value
    );
    routeByRole(p);
  } catch(err) { showAlertAuth(friendlyErrAuth(err)); setBusyAuth('btn-in', false); }
};

window.doGoogle = async () => {
  try {
    const p = await loginWithGoogle();
    routeByRole(p);
  } catch(err) {
    if (err.code !== 'auth/popup-closed-by-user') showAlertAuth(friendlyErrAuth(err));
  }
};

window.doRegister = async (e) => {
  e.preventDefault();
  const name  = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const pass  = document.getElementById('reg-pass').value;
  const pass2 = document.getElementById('reg-pass2').value;
  if (pass !== pass2) { showAlertAuth('Las contrase&ntilde;as no coinciden.'); return; }
  setBusyAuth('btn-reg', true);
  try {
    const p = await registerUser(name, email, pass);
    routeByRole(p);
  } catch(err) { showAlertAuth(friendlyErrAuth(err)); setBusyAuth('btn-reg', false); }
};

window.doForgot = async () => {
  const email = document.getElementById('in-email').value.trim();
  if (!email) { showAlertAuth('Ingres&aacute; tu correo primero.', 'warning'); return; }
  try {
    await resetPassword(email);
    showAlertAuth('<i class="ph ph-check-circle"></i> Revis&aacute; tu correo para restablecer la contrase&ntilde;a.', 'success');
  } catch(err) { showAlertAuth(friendlyErrAuth(err)); }
};

// ── UI helpers ──
window.toggleEye = (id, btn) => {
  const i = document.getElementById(id);
  i.type = i.type==='password'?'text':'password';
  btn.innerHTML = i.type==='password'?'<i class="ph ph-eye"></i>':'<i class="ph ph-eye-slash"></i>';
};
window.checkPw = (inp) => {
  const v=inp.value, bar=document.getElementById('pw-bar');
  if(!v){bar.className='pw-bar';return;}
  const strong=v.length>=8&&/[A-Z]/.test(v)&&/[0-9]/.test(v)&&/[^A-Za-z0-9]/.test(v);
  const ok=v.length>=8&&(/[A-Z]/.test(v)||/[0-9]/.test(v));
  bar.className='pw-bar '+(strong?'strong':ok?'ok':'weak');
};
function showAlertAuth(msg, type='danger') {
  const el=document.getElementById('auth-alert');
  el.className=`alert alert-${type}`;
  el.innerHTML=msg;
  el.classList.remove('hidden');
}
function clearAlertAuth(){ document.getElementById('auth-alert').classList.add('hidden'); }
function setBusyAuth(id, busy) {
  const b=document.getElementById(id);
  b.disabled=busy;
  if(!b._orig) b._orig=b.textContent;
  b.innerHTML=busy?'<span class="spinner"></span> Procesando...':b._orig;
}
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
function friendlyErrAuth(err) {
  const code = err?.code;
  return ({
    'auth/user-not-found':'No existe una cuenta con ese correo.',
    'auth/wrong-password':'Contrase&ntilde;a incorrecta.',
    'auth/invalid-credential':'Correo o contrase&ntilde;a incorrectos.',
    'auth/email-already-in-use':'Ese correo ya est&aacute; registrado. <button class="btn btn-ghost btn-sm" onclick="switchTab(\'in\')">Ingresar</button>',
    'auth/weak-password':'La contrase&ntilde;a debe tener al menos 6 caracteres.',
    'auth/invalid-email':'El formato del correo no es v&aacute;lido.',
    'auth/too-many-requests':'Demasiados intentos. Esper&aacute; unos minutos.',
    'auth/network-request-failed':'Sin conexi&oacute;n. Verific&aacute; tu internet.',
  })[code] || (code ? `Error: ${code}` : err?.message || 'Error inesperado');
}
</script>
</body>
</html>
