<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f172a">
<title>FinanceOS — Mis Finanzas</title>
<link rel="manifest" href="../manifest.json">
<link rel="icon" type="image/png" href="../icons/favicon.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="../css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css">
<style>
html{height:100%}
body{height:100%;overflow:hidden;display:flex;flex-direction:column}
:root{--nav-h:64px;--top-h:56px;--safe-bottom:env(safe-area-inset-bottom,0px)}
#topbar{height:var(--top-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0;z-index:100}
#menu-btn{display:none;background:none;border:none;color:var(--text2);font-size:1.4rem;cursor:pointer;padding:4px 8px}
.top-logo{font-size:1.05rem;font-weight:900;color:var(--primary)}
.top-logo span{color:var(--text2);font-weight:400}
#topbar-title{flex:1;font-size:.92rem;font-weight:600;text-align:center}
#topbar-action{margin-left:auto}
.user-avatar{width:30px;height:30px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:#fff;cursor:pointer;flex-shrink:0}
#layout{display:flex;flex:1;overflow:hidden}
#sidebar{width:230px;min-width:230px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;transition:transform .25s}
.sidebar-logo{padding:16px 18px 12px;border-bottom:1px solid var(--border)}
.sidebar-logo-text{font-size:1.1rem;font-weight:900;color:var(--primary)}
.sidebar-logo-text span{color:var(--text2);font-weight:400}
.sidebar-meta{font-size:.7rem;color:var(--text3);margin-top:2px}
nav{flex:1;padding:8px;overflow-y:auto}
.nav-section{font-size:.62rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px;padding:12px 12px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-sm);cursor:pointer;color:var(--text2);font-size:.85rem;font-weight:500;transition:.12s;margin-bottom:1px;min-height:40px;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--primary);color:#fff;font-weight:600}
.nav-item .ni{font-size:1rem;width:20px;text-align:center;flex-shrink:0}
#sidebar-footer{padding:12px;border-top:1px solid var(--border)}
#content-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
#content{flex:1;overflow-y:auto;padding:16px;padding-bottom:calc(var(--nav-h) + 16px + var(--safe-bottom))}
#bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + var(--safe-bottom));background:var(--surface);border-top:1px solid var(--border);padding-bottom:var(--safe-bottom);z-index:300;align-items:stretch}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;gap:3px;padding:6px 4px;color:var(--text3);font-size:.62rem;font-weight:600;text-transform:uppercase;letter-spacing:.4px;border:none;background:none}
.bn-item.active{color:var(--primary)}
.bn-icon{font-size:1.2rem;line-height:1}
.bn-fab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.bn-fab-btn{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-d));border:none;color:#fff;font-size:1.5rem;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px #6366f155;cursor:pointer;margin-top:-20px}
.bn-fab-label{font-size:.6rem;font-weight:600;color:var(--text3);text-transform:uppercase;margin-top:2px}
#sidebar-overlay{display:none;position:fixed;inset:0;background:#000a;z-index:199}
#sidebar-overlay.open{display:block}
/* VOICE FAB */
#voice-fab{
  position:fixed;right:16px;bottom:calc(var(--nav-h) + 20px + var(--safe-bottom));
  width:56px;height:56px;border-radius:50%;
  background:linear-gradient(145deg,#0d9488,#14b8a6,#06b6d4);
  border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px #0d948855, 0 2px 6px #0004;
  z-index:290;transition:transform .15s,box-shadow .15s;
}
#voice-fab:hover{transform:scale(1.07);box-shadow:0 6px 24px #0d948880}
#voice-fab:active{transform:scale(.92)}
#voice-fab.listening{
  animation:voicePulse 1.1s ease-in-out infinite;
  background:linear-gradient(145deg,#b91c1c,#ef4444,#f87171);
}
@keyframes voicePulse{
  0%,100%{box-shadow:0 4px 16px #ef444455;transform:scale(1)}
  50%{box-shadow:0 4px 40px #ef4444aa,0 0 0 12px #ef444418;transform:scale(1.05)}
}
/* Rings animadas cuando escucha */
#voice-fab.listening::before,#voice-fab.listening::after{
  content:'';position:absolute;border-radius:50%;border:2px solid #ef4444;
  animation:voiceRing 1.1s ease-out infinite;
}
#voice-fab.listening::after{animation-delay:.4s}
@keyframes voiceRing{
  0%{width:56px;height:56px;opacity:.7}
  100%{width:90px;height:90px;opacity:0}
}
.voice-tooltip{
  position:absolute;right:66px;
  background:rgba(15,23,42,.95);border:1px solid var(--border);
  color:var(--text);font-size:.73rem;font-weight:600;
  padding:6px 12px;border-radius:20px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .2s;
  box-shadow:0 2px 8px #0004;
}
#voice-fab:hover .voice-tooltip{opacity:1}
#voice-fab.listening .voice-tooltip{opacity:1;background:#7f1d1d;border-color:#ef4444;color:#fca5a5}
#voice-result-card{display:none;position:fixed;left:16px;right:80px;bottom:calc(var(--nav-h) + 90px + var(--safe-bottom));background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;z-index:291;box-shadow:0 8px 32px #0008;animation:cardIn .2s ease}
@keyframes cardIn{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
#voice-result-card .vr-transcript{font-size:.78rem;color:var(--text2);margin-bottom:8px;font-style:italic}
#voice-result-card .vr-parsed{font-size:.9rem;font-weight:700;margin-bottom:10px}
/* MODALS */
.modal-overlay{display:none;position:fixed;inset:0;background:#000b;z-index:500;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-radius:var(--r) var(--r) 0 0;width:100%;max-height:92vh;overflow-y:auto;animation:modalIn .2s ease}
@keyframes modalIn{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-handle{width:44px;height:5px;background:var(--surface3);border-radius:3px;margin:10px auto 0}
.modal-header{padding:14px 16px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:1rem;font-weight:700}
/* X bien visible */
.modal-close{width:32px;height:32px;border-radius:50%;background:var(--surface2);border:none;color:var(--text);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-close:active{background:var(--surface3)}
/* Botón registrar pegado al fondo */
.modal-body{padding:14px 16px;padding-bottom:calc(14px + var(--safe-bottom))}
.modal-body{padding:16px 20px;padding-bottom:calc(20px + var(--safe-bottom))}
.form-group{margin-bottom:10px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* Botón submit sticky en modales */
.modal-submit{position:sticky;bottom:0;margin:0 -16px -14px;padding:12px 16px;background:var(--surface);border-top:1px solid var(--border)}
.input-prefix{display:flex;align-items:center;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden;min-height:44px}
.input-prefix span{padding:0 10px;color:var(--text3);font-size:.9rem;flex-shrink:0;font-weight:700}
.input-prefix input{border:none;background:transparent;border-radius:0;min-height:42px}
.input-prefix:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
/* UI components */
.hero{background:linear-gradient(135deg,#1e1b4b,#312e81);border:1px solid #4338ca50;border-radius:var(--r);padding:20px;text-align:center;position:relative;overflow:hidden}
.hero-label{font-size:.7rem;font-weight:700;color:#a5b4fc;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.hero-amount{font-size:2.2rem;font-weight:900;color:#fff;letter-spacing:-1px;line-height:1}
.hero-sub{font-size:.78rem;color:#a5b4fc;margin-top:6px}
.hero-row{display:flex;gap:10px;margin-top:12px}
.hero-stat{flex:1;background:#ffffff12;border-radius:var(--r-sm);padding:10px;text-align:center}
.hero-stat-val{font-size:1rem;font-weight:700;margin-bottom:2px}
.hero-stat-label{font-size:.62rem;color:#a5b4fc;text-transform:uppercase;letter-spacing:.4px}
.period-tabs{display:flex;background:var(--surface2);border-radius:20px;padding:3px;margin-bottom:14px}
.period-tab{flex:1;padding:7px 6px;text-align:center;border-radius:17px;cursor:pointer;font-size:.78rem;font-weight:600;color:var(--text2);transition:.15s;border:none;background:none}
.period-tab.active{background:var(--primary);color:#fff}
.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.qa-btn{border:none;border-radius:var(--r);padding:16px;cursor:pointer;font-size:.85rem;font-weight:700;display:flex;align-items:center;gap:8px;justify-content:center;transition:.15s;min-height:52px}
.qa-btn:active{transform:scale(.97)}
.qa-ingreso{background:linear-gradient(135deg,#065f46,#10b981);color:#fff}
.qa-egreso{background:linear-gradient(135deg,#7f1d1d,#ef4444);color:#fff}
.qa-traslado{background:var(--surface2);color:var(--text);grid-column:span 2;min-height:42px;font-size:.8rem}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;position:relative;overflow:hidden}
.kpi-label{font-size:.68rem;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.kpi-value{font-size:1.4rem;font-weight:900;line-height:1.1}
.kpi-sub{font-size:.73rem;color:var(--text2);margin-top:3px}
.kpi-icon{position:absolute;right:10px;top:10px;font-size:1.3rem;opacity:.7}
.kpi.green .kpi-value{color:var(--success)}.kpi.red .kpi-value{color:var(--danger)}
.kpi.blue .kpi-value{color:var(--info)}.kpi.purple .kpi-value{color:var(--primary)}.kpi.amber .kpi-value{color:var(--warning)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-title{font-size:.7rem;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.progress-bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px;transition:.4s}
.progress-label{display:flex;justify-content:space-between;font-size:.75rem;color:var(--text2);margin-bottom:5px}
.tx-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.tx-item:last-child{border-bottom:none}
.tx-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
.tx-icon.ing{background:#10b98122}.tx-icon.eg{background:#ef444422}.tx-icon.tr{background:#38bdf822}
.tx-info{flex:1;min-width:0}
.tx-name{font-size:.87rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-cat{font-size:.7rem;color:var(--text2);margin-top:1px}
.tx-amount{font-size:.92rem;font-weight:700;flex-shrink:0}
.tx-date-group{font-size:.68rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;padding:10px 0 5px}
.psych-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.psych-opt{padding:11px 6px;border-radius:var(--r-sm);border:2px solid var(--border);text-align:center;cursor:pointer;transition:.15s}
.psych-opt.sel{border-color:var(--primary);background:var(--primary-light)}
.psych-emoji{font-size:1.3rem;display:block;margin-bottom:3px}
.psych-name{font-size:.72rem;font-weight:700}
.psych-sub{font-size:.62rem;color:var(--text2);margin-top:1px}
.type-tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:14px}
.type-tab{padding:10px;text-align:center;border-radius:var(--r-sm);cursor:pointer;font-size:.82rem;font-weight:700;border:2px solid var(--border);background:transparent;color:var(--text2)}
.type-tab.sel-ing{border-color:var(--success);background:#10b98118;color:var(--success)}
.type-tab.sel-eg{border-color:var(--danger);background:#ef444418;color:var(--danger)}
.type-tab.sel-tr{border-color:var(--info);background:#38bdf818;color:var(--info)}
.badge{display:inline-flex;padding:3px 8px;border-radius:20px;font-size:.68rem;font-weight:700}
.badge-green{background:#10b98122;color:#34d399}.badge-red{background:#ef444422;color:#f87171}
.badge-amber{background:#f59e0b22;color:#fbbf24}.badge-gray{background:var(--surface2);color:var(--text2)}
.chart-wrap{position:relative}.chart-wrap.h200{height:200px}.chart-wrap.h240{height:240px}.chart-wrap.h280{height:280px}
.alert{padding:11px 14px;border-radius:var(--r-sm);margin-bottom:12px;font-size:.82rem;display:flex;gap:10px;align-items:flex-start;line-height:1.4}
.alert-warning{background:#f59e0b12;border:1px solid #f59e0b40;color:var(--warning)}
.alert-info{background:#38bdf812;border:1px solid #38bdf840;color:var(--info)}
.alert-danger{background:#ef444412;border:1px solid #ef444440;color:var(--danger)}
.alert-success{background:#10b98112;border:1px solid #10b98140;color:var(--success)}
.empty-state{text-align:center;padding:32px 16px;color:var(--text2)}
.es-icon{font-size:2rem;margin-bottom:10px}
hr{border:none;border-top:1px solid var(--border);margin:14px 0}
.text-success{color:var(--success)}.text-danger{color:var(--danger)}.text-warning{color:var(--warning)}
.text-2{color:var(--text2)}.text-3{color:var(--text3)}.fs-xs{font-size:.7rem}.fs-sm{font-size:.8rem}
.fw-bold{font-weight:700}.fw-800{font-weight:800}
.section-title{font-size:.98rem;font-weight:700}
@media(max-width:767px){
  #menu-btn{display:block}
  #sidebar{position:fixed;top:0;left:0;bottom:0;z-index:200;transform:translateX(-100%)}
  #sidebar.open{transform:translateX(0)}
  #bottom-nav{display:flex}
  #content{padding-bottom:calc(var(--nav-h)+12px+var(--safe-bottom))}
  .grid-3{grid-template-columns:1fr 1fr}
  .form-row{grid-template-columns:1fr}
}
@media(min-width:768px){
  #voice-fab{bottom:24px}
  #voice-result-card{bottom:90px}
  .modal-overlay{align-items:center}
  .modal{border-radius:var(--r);width:480px;max-width:96vw}
  #content{padding-bottom:20px}
}
</style>
</head>
<body>
<div id="loading-screen">
  <div class="loading-logo">Finance<span>OS</span></div>
  <div class="loading-bar"><div class="loading-bar-fill"></div></div>
  <div class="fs-xs text-3">Cargando tus finanzas...</div>
</div>
<div id="topbar" class="hidden">
  <button id="menu-btn" onclick="toggleSidebar()"><i class="ph ph-list"></i></button>
  <span class="top-logo">Finance<span>OS</span></span>
  <span id="topbar-title"></span>
  <div id="topbar-action"></div>
  <div class="user-avatar" id="user-avatar" onclick="navigate('configuracion')">U</div>
</div>
<div id="layout" class="hidden">
  <div id="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-text">Finance<span>OS</span></div>
      <div class="sidebar-meta" id="user-name-label">Mi cuenta</div>
    </div>
    <nav id="nav">
      <div class="nav-section">Principal</div>
      <button class="nav-item active" data-page="inicio"><span class="ni"><i class="ph ph-house"></i></span> Inicio</button>
      <button class="nav-item" data-page="movimientos" data-hab="movimientos"><span class="ni"><i class="ph ph-credit-card"></i></span> Movimientos</button>
      <button class="nav-item" data-page="cuentas"><span class="ni"><i class="ph ph-bank"></i></span> Cuentas</button>
      <div class="nav-section">Estrategia</div>
      <button class="nav-item" data-page="presupuesto" data-hab="presupuesto"><span class="ni"><i class="ph ph-clipboard-text"></i></span> Presupuesto</button>
      <button class="nav-item" data-page="objetivos" data-hab="objetivos"><span class="ni"><i class="ph ph-shield-check"></i></span> Fondo Emergencia</button>
      <div class="nav-section">Crecimiento</div>
      <button class="nav-item" data-page="inversiones" data-hab="inversiones"><span class="ni"><i class="ph ph-trend-up"></i></span> Inversiones</button>
      <button class="nav-item" data-page="credito" data-hab="credito"><span class="ni"><i class="ph ph-credit-card"></i></span> Crédito y Deuda</button>
      <div class="nav-section">Análisis</div>
      <button class="nav-item" data-page="reportes" data-hab="reportes"><span class="ni"><i class="ph ph-chart-bar"></i></span> Reportes</button>
      <button class="nav-item" data-page="educacion" data-hab="educacion"><span class="ni"><i class="ph ph-graduation-cap"></i></span> Educación</button>
    </nav>
    <div id="sidebar-footer">
      <button class="btn btn-ghost btn-block btn-sm" onclick="handleLogout()"><i class="ph ph-sign-out"></i> Cerrar sesión</button>
    </div>
  </div>
  <div id="sidebar-overlay" onclick="closeSidebar()"></div>
  <div id="content-wrap"><div id="content"></div></div>
</div>
<div id="bottom-nav" class="hidden">
  <button class="bn-item active" data-page="inicio"><span class="bn-icon"><i class="ph ph-house"></i></span>Inicio</button>
  <button class="bn-item" data-page="movimientos" data-hab="movimientos"><span class="bn-icon"><i class="ph ph-credit-card"></i></span>Movimientos</button>
  <div class="bn-fab">
    <button class="bn-fab-btn" onclick="openNewTx('egreso')"><i class="ph ph-plus"></i></button>
    <span class="bn-fab-label">Registrar</span>
  </div>
  <button class="bn-item" data-page="reportes" data-hab="reportes"><span class="bn-icon"><i class="ph ph-chart-bar"></i></span>Reportes</button>
  <button class="bn-item" data-page="mas"><span class="bn-icon"><i class="ph ph-dots-three-outline-vertical"></i></span>Más</button>
</div>
<!-- Voice FAB -->
<div id="voice-fab" class="hidden" onclick="toggleVoice()">
  <!-- Micrófono SVG -->
  <svg id="voice-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="9" y="2" width="6" height="11" rx="3" fill="white"/>
    <path d="M5 11C5 14.866 8.13401 18 12 18C15.866 18 19 14.866 19 11" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="12" y1="18" x2="12" y2="22" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="9" y1="22" x2="15" y2="22" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </svg>
  <span class="voice-tooltip" id="voice-tooltip">Decí un gasto o ingreso</span>
</div>
<!-- Modals -->
<div class="modal-overlay" id="modal-tx" onclick="if(event.target===this)closeModal('modal-tx')">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <span class="modal-title" id="modal-tx-title">Nueva Transacción</span>
      <button class="modal-close" onclick="closeModal('modal-tx')"><i class="ph ph-x"></i></button>
    </div>
    <div class="modal-body" id="modal-tx-body"></div>
  </div>
</div>
<div class="modal-overlay" id="modal-generic" onclick="if(event.target===this)closeModal('modal-generic')">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <span class="modal-title" id="modal-generic-title">—</span>
      <button class="modal-close" onclick="closeModal('modal-generic')"><i class="ph ph-x"></i></button>
    </div>
    <div class="modal-body" id="modal-generic-body"></div>
  </div>
</div>
<!-- Portal de voz — fuera del layout principal, overflow visible -->
<div id="voice-portal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:2147483647;background:rgba(0,0,0,.72);align-items:flex-end;justify-content:center;font-family:system-ui,sans-serif">
  <div id="voice-card" style="background:#1e293b;border-radius:18px 18px 0 0;width:100%;max-width:500px;padding:22px 24px 28px;color:#f1f5f9;box-shadow:0 -4px 24px rgba(0,0,0,.5);position:relative">
    <button id="voice-portal-close" style="position:fixed;top:14px;right:18px;z-index:1;background:none;border:none;color:#64748b;font-size:1.4rem;cursor:pointer;line-height:1;padding:4px">✕</button>
